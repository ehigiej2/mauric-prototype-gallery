<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ee"><title>Mama Akara · Osayi</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{position:fixed;inset:0;height:100dvh;background:#fff8ee;color:#18382a;font:600 16px system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}#app{height:100%;height:100dvh;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));gap:8px;overflow:hidden}#top{display:flex;align-items:center;justify-content:space-between;flex:none;min-height:35px}#top strong{font-size:18px}#home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:9px;flex:1;min-height:0}#home button{border:0;border-radius:20px;color:white;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;padding:clamp(8px,2vh,17px);min-width:0;min-height:0;box-shadow:0 3px 8px #0001}#home .emoji{font-size:clamp(21px,5vh,35px)}#home b{font-size:clamp(14px,3.8vw,20px);line-height:1.1;margin-top:4px}#home small{font-size:11px;line-height:1.2;margin-top:4px;opacity:.95}#home button:nth-child(1){background:#c34e26}#home button:nth-child(2){background:#15845b}#home button:nth-child(3){background:#7546b5}#home button:nth-child(4){background:#2179aa}#home button:nth-child(5){background:#b37a20}#home button:nth-child(6){background:#b34c7d}#work{display:none;flex:1;min-height:0;flex-direction:column;gap:8px}#work h1{font-size:clamp(18px,4.7vw,25px);line-height:1.15;margin:0}#question{font-size:clamp(15px,4vw,19px);margin:0;line-height:1.25}#fields{display:flex;flex-direction:column;gap:9px;flex:1;min-height:0;justify-content:center}label{display:flex;flex-direction:column;gap:4px;font-size:14px}input,select{width:100%;padding:12px;border:2px solid #c4d3c5;border-radius:13px;background:white;color:#18382a;font-size:17px;min-height:48px}#result{display:none;background:#e5f4e8;border-radius:13px;padding:11px;white-space:pre-line;font-size:14px;line-height:1.35;max-height:27dvh;overflow:hidden}#actions{display:flex;gap:8px;flex:none}#actions button,#homeBtn{border:0;border-radius:13px;padding:12px 8px;font-size:15px;font-weight:800}#back{background:#e2eadf;color:#17422d;flex:1}#next{background:#14774f;color:white;flex:2}#homeBtn{background:#f0e4d2;color:#5e4c34;padding:8px 10px}#step{font-size:12px;color:#52665b}#notice{font-size:10px;color:#657268;text-align:center;flex:none}#home[hidden],#work[hidden]{display:none!important}@media(max-height:590px){#top{min-height:25px}#top strong{font-size:15px}#app{gap:5px}#home{gap:5px}#home button{border-radius:13px;padding:6px}#home small{display:none}#home b{font-size:13px}#fields{gap:5px}input,select{min-height:40px;padding:6px}#notice{display:none}}
</style></head><body><div id="app"><div id="top"><strong>🍘 Mama Akara × Osayi</strong><button id="homeBtn" type="button">🏠 Home</button></div><div id="home"><button data-go="money"><span class="emoji">🍘</span><b>My Akara Money</b><small>Wetin remain?</small></button><button data-go="buy"><span class="emoji">🛍️</span><b>Who Wan Buy Akara?</b><small>Collect order</small></button><button data-go="beans"><span class="emoji">🫘</span><b>Buy Better Beans</b><small>Who cheaper?</small></button><button data-go="carry"><span class="emoji">🛵</span><b>Carry Akara Go</b><small>Delivery plan</small></button><button data-go="orders"><span class="emoji">📋</span><b>My Orders</b><small>See orders</small></button><button data-go="grow"><span class="emoji">🌍</span><b>Reach Everywhere</b><small>Grow small-small</small></button></div><section id="work" hidden><h1 id="heading"></h1><p id="question"></p><div id="fields"></div><div id="result"></div><div id="step"></div><div id="actions"><button id="back">⬅️ Back</button><button id="next">Next ➡️</button></div></section><div id="notice">Na research demo. No real payment or rider connected.</div></div><script>
const $=id=>document.getElementById(id),money=n=>'₦'+Math.round(n).toLocaleString('en-NG'),store='mama-akara-simple-v5';let data={};try{data=JSON.parse(localStorage.getItem(store)||'{}')}catch(e){};let mode='',index=0,steps=[];const val=id=>$(id)?.value||'',num=id=>Number(val(id))||0;function save(){try{localStorage.setItem(store,JSON.stringify(data))}catch(e){}}function field(id,label,type='number',value='',options=[]){const v=data[id]??value;if(type==='select')return '<label>'+label+'<select id="'+id+'">'+options.map(x=>'<option '+(x===v?'selected':'')+'>'+x+'</option>').join('')+'</select></label>';return '<label>'+label+'<input id="'+id+'" type="'+type+'" value="'+String(v).replace(/"/g,'&quot;')+'" '+(type==='number'?'min="0" inputmode="decimal"':'maxlength="90"')+'></label>'}function page(title,question,fields=[],action='Next ➡️',run=null){return {title,question,fields,action,run}}function build(m){switch(m){
case 'money':return [page('🍘 My Akara Money','How many akara you fry?', [field('fried','Akara wey you fry','number',100),field('sold','How many you sell?','number',80)]),page('🍘 My Akara Money','How much each one?', [field('price','One akara price (₦)','number',100),field('cost','Beans, oil and other cost (₦)','number',4000)],'Show my money',()=>{let sold=Math.min(num('sold'),num('fried'));return 'Money wey enter: '+money(sold*num('price'))+'\nMoney wey remain before other expenses: '+money(sold*num('price')-num('cost'))})];
case 'buy':return [page('🛍️ Who Wan Buy Akara?','Wetin customer wan buy?', [field('product','Choose food','select','Akara',['Akara','Akara and bread','Akara and pap','Dry akara mix']),field('qty','How many?','number',10)]),page('🛍️ Who Wan Buy Akara?','How customer wan collect am?', [field('pickup','Choose one','select','I go collect',['I go collect','Deliver am — confirm fee']),field('when','When you need am?','text','Tomorrow morning')]),page('🛍️ Who Wan Buy Akara?','Mama business WhatsApp number?', [field('phone','Number start with 234','tel','')],'Send order 📲',()=>{let p=val('phone').replace(/\D/g,'');if(!/^234[789][01]\d{8}$/.test(p))return 'Mama, put correct business WhatsApp number first. No order send.';let msg='Mama, I wan order '+val('qty')+' '+val('product')+'. '+val('pickup')+'. When: '+val('when')+'. Abeg confirm price and availability.';window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank','noopener');return 'WhatsApp don open. Customer must press Send. Mama go confirm order herself.'})];
case 'beans':return [page('🫘 Buy Better Beans','How much dem dey sell beans?', [field('beansA','Supplier A total cost (₦)','number',3500),field('beansB','Supplier B total cost (₦)','number',3200)] ,'Compare price',()=>{let a=num('beansA'),b=num('beansB');return (a<=b?'Supplier A':'Supplier B')+' cheaper by '+money(Math.abs(a-b))+'. Check quality and transport first. Na your own price you enter.'})];
case 'carry':return [page('🛵 Carry Akara Go','Where akara wan go?', [field('dest','Choose place','select','Inside Benin',['Inside Benin','Another Nigerian city','Outside Nigeria']),field('food','Wetin you dey send?','select','Hot fresh akara',['Hot fresh akara','Chilled or frozen food','Dry akara mix'])],'Check am',()=>{let far=val('dest')==='Outside Nigeria',hot=val('food')==='Hot fresh akara';return far&&hot?'Hot fresh akara no fit go overseas like ordinary parcel.':far?'Check food export rules, packaging and carrier first. No booking yet.':hot?'Fresh akara need quick, safe local delivery. No rider connected yet.':'Check storage, packaging and approved transport first. No rider connected yet.'})];
case 'orders':return [page('📋 My Orders','Mama, you wan see practice orders?',[],'Show orders',()=>{let o=data.practice||[];return o.length?o.map((x,i)=>(i+1)+'. '+x.qty+' akara — '+x.status).join('\n'):'No practice order yet. WhatsApp orders dey inside Mama WhatsApp, no automatic sync yet.'}),page('📋 My Orders','Add practice order?', [field('practiceQty','How many akara?','number',20)],'Save practice order',()=>{data.practice=data.practice||[];data.practice.push({qty:num('practiceQty'),status:'Practice only'});save();return 'Practice order saved for this phone. No real order sent.'})];
case 'grow':return [page('🌍 Reach Everywhere','How many rounds you fry each day?', [field('rounds','Rounds per day','number',2),field('days','Days per month','number',20)],'Show possibility',()=>{let sales=num('sold')*num('price')*num('rounds')*num('days');return 'If demand dey, possible monthly sales: '+money(sales)+'. Na example, no be guaranteed profit. Start with local buyers and diaspora family orders.'})];
default:return []}}
function render(){let s=steps[index];$('heading').textContent=s.title;$('question').textContent=s.question;$('fields').innerHTML=s.fields.join('');$('result').style.display='none';$('result').textContent='';$('step').textContent='Step '+(index+1)+' of '+steps.length;$('back').textContent=index?'⬅️ Back':'🏠 Home';$('next').textContent=s.action;$('next').disabled=false}
function open(m){mode=m;index=0;steps=build(m);$('home').hidden=true;$('work').hidden=false;$('work').style.display='flex';render()}
function home(){$('work').hidden=true;$('work').style.display='none';$('home').hidden=false;mode=''}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(b.dataset.go));$('homeBtn').onclick=home;$('back').onclick=()=>{if(index) {index--;render()}else home()};$('next').onclick=()=>{document.querySelectorAll('#fields input,#fields select').forEach(el=>data[el.id]=el.value);save();let s=steps[index];if(s.run){$('result').textContent=s.run();$('result').style.display='block';$('next').textContent='🏠 Home';$('next').onclick=()=>{$('next').onclick=advance;home()};return}advance()};function advance(){if(index<steps.length-1){index++;render()}else home()}const originalNext=$('next').onclick;function resetNext(){ $('next').onclick=originalNext }const oldRender=render;render=function(){resetNext();oldRender()};if(new URLSearchParams(location.search).has('mama')){data.phone=new URLSearchParams(location.search).get('mama');open('buy')}
</script></body></html>
