</style><style id="benin-premium">body{background:radial-gradient(circle at 10% 0%,#fff6dc,#fff8ee 55%,#f6e7d8)}#top strong{letter-spacing:-.45px}#home button{position:relative;border:1px solid #ffffff55;box-shadow:0 6px 14px #45210d22,inset 0 1px 0 #ffffff44;transition:transform .15s ease,filter .15s ease}#home button:active{transform:scale(.965);filter:brightness(1.06)}#home button:nth-child(1){background:linear-gradient(145deg,#d8692f,#a93e1d)}#home button:nth-child(2){background:linear-gradient(145deg,#24a879,#0c6b51)}#home button:nth-child(3){background:linear-gradient(145deg,#9566d1,#67409b)}#home button:nth-child(4){background:linear-gradient(145deg,#39a0cf,#1b6798)}#home button:nth-child(5){background:linear-gradient(145deg,#d6a13d,#a36b18)}#home button:nth-child(6){background:linear-gradient(145deg,#d872a2,#9f3d70)}#home .emoji{filter:drop-shadow(0 2px 2px #0002)}#work{background:#ffffffc9;border-radius:18px;padding:clamp(10px,2vh,16px);box-shadow:0 4px 20px #583a1815}#next{background:linear-gradient(120deg,#168f60,#0c6a4b)}#homeBtn{background:#f5e6d1}#notice{font-weight:700}@media(max-height:590px){#work{padding:7px}#top strong span{font-size:9px!important}}</style><style id="animated-art">#home .emoji{display:block;transform-origin:center;animation:floatAkara 3.8s ease-in-out infinite}#home button:nth-child(2) .emoji{animation-delay:-.8s}#home button:nth-child(3) .emoji{animation-delay:-1.5s}#home button:nth-child(4) .emoji{animation-delay:-2.2s}#home button:nth-child(5) .emoji{animation-delay:-2.9s}#home button:nth-child(6) .emoji{animation-delay:-3.5s}#home small{transition:opacity .2s ease}#home button:focus-visible{outline:4px solid #222;outline-offset:2px}@keyframes floatAkara{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(3deg)}}@media(prefers-reduced-motion:reduce){#home .emoji{animation:none!important}}#result{font-size:clamp(12px,3.4vw,14px);line-height:1.3;max-height:none;min-height:0;overflow:hidden;display: x}#osayiQuick button{padding:4px 7px}#osayiNote{display:none}}</style></head><body><div id="app"><div id="top"><strong>🍘 Mama Akara <span style="font-size:11px;font-weight:700;color:#a15e2c">Benin → World 🌍</span></strong><button id="homeBtn" type="button">🏠 Home</button></div><div id="home"><button data-go="money"><span class="emoji">🍘</span><b>My Akara Money</b><small>Wetin remain?</small></button><button data-go="buy"><span class="emoji">🛍️</span><b>Who Wan Buy Akara?</b><small>Benin & abroad orders</small></button><button data-go="beans"><span class="emoji">🫘</span><b>Buy Better Beans</b><small>Who cheaper?</small></button><button data-go="carry"><span class="emoji">🛵</span><b>Carry Akara Go</b><small>Delivery plan</small></button><button data-go="orders"><span class="emoji">📋</span><b>My Orders</b><small>See orders</small></button><button data-go="grow"><span class="emoji">🌍</span><b>Reach Everywhere</b><small>Benin to the world</small></button></div><section id="work" hidden><h1 id="heading"></h1><p id="question"></p><div id="fields"></div><div id="result"></div><div id="step"></div><div id="actions"><button id="back">⬅️ Back</button><button id="next">Next ➡️</button></div></section><div id="notice">Made for Benin City ❤️ · Research demo only</div></div><script>
const $=id=>document.getElementById(id),money=n=>'₦'+Math.round(n).toLocaleString('en-NG'),store='mama-akara-simple-v5';let data={};try{data=JSON.parse(localStorage.getItem(store)||'{}')}catch(e){};let mode='',index=0,steps=[];const val=id=>$(id)?.value||'',num=id=>Number(val(id))||0;function save(){try{localStorage.setItem(store,JSON.stringify(data))}catch(e){}}function field(id,label,type='number',value='',options=[]){const v=data[id]??value;if(type==='select')return '<label>'+label+'<select id="'+id+'">'+options.map(x=>'<option '+(x===v?'selected':'')+'>'+x+'</option>').join('')+'</select></label>';return '<label>'+label+'<input id="'+id+'" type="'+type+'" value="'+String(v).replace(/"/g,'&quot;')+'" '+(type==='number'?'min="0" inputmode="decimal"':'maxlength="90"')+'></label>'}function page(title,question,fields=[],action='Next ➡️',run=null){return {title,question,fields,action,run}}function build(m){switch(m){
case 'money':return [page('🍘 My Akara Money','How many akara you fry?', [field('fried','Akara wey you fry','number',100),field('sold','How many you sell?','number',80)]),page('🍘 My Akara Money','How much each one?', [field('price','One akara price (₦)','number',100),field('cost','Beans, oil and other cost (₦)','number',4000)],'Show my money',()=>{let sold=Math.min(num('sold'),num('fried'));return 'Money wey enter: '+money(sold*num('price'))+'\nMoney wey remain before other expenses: '+money(sold*num('price')-num('cost'))})];
case 'buy':return [page('🛍️ Who Wan Buy Akara?','Na who wan chop? Benin people and people abroad fit order for family here!', [field('product','Choose food','select','Akara',['Akara','Akara and bread','Akara and pap','Dry akara mix']),field('qty','How many?','number',10)]),page('🛍️ Who Wan Buy Akara?','How customer wan collect am?', [field('pickup','Choose one','select','I go collect',['I go collect','Deliver for Benin — confirm fee','Diaspora buy for family in Benin']),field('when','When you need am?','text','Tomorrow morning')]),page('🛍️ Who Wan Buy Akara?','Mama, where customer go send order?', [field('phone','Number start with 234','tel','')],'Send order 📲',()=>{let p=val('phone').replace(/\D/g,'');if(!/^234[789][01]\d{8}$/.test(p))return 'Mama, put correct business WhatsApp number first. No order send.';let msg='Hello Mama Akara! 🍘 I wan order '+val('qty')+' '+val('product')+'. '+val('pickup')+'. When: '+val('when')+'. Abeg confirm price and availability before payment. Na request, no be confirmed order.';window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank','noopener');return 'WhatsApp don open. Customer must press Send. Mama go confirm order herself.'})];
case 'beans':return [page('🫘 Buy Better Beans','How much dem dey sell beans?', [field('beansA','Supplier A total cost (₦)','number',3500),field('beansB','Supplier B total cost (₦)','number',3200)] ,'Compare price',()=>{let a=num('beansA'),b=num('beansB');return (a<=0||b<=0)?'Put both supplier prices first.':(a<=b?'Supplier A':'Supplier B')+' cheaper by '+money(Math.abs(a-b))+'. Check quality and transport first. Na your own price you enter.'})];
case 'carry':return [page('🛵 Carry Akara Go','Where akara wan go?', [field('dest','Choose place','select','Inside Benin',['Inside Benin','Lagos or Abuja','Another Nigerian city','Outside Nigeria']),field('food','Wetin you dey send?','select','Hot fresh akara',['Hot fresh akara','Chilled or frozen food','Dry akara mix'])],'Check am',()=>{let far=val('dest')==='Outside Nigeria',hot=val('food')==='Hot fresh akara';return far&&hot?'Hot fresh akara no fit go overseas like ordinary parcel.':far?'Check food export rules, packaging and carrier first. No booking yet.':hot?'Fresh akara need quick, safe local delivery. No rider connected yet.':'Check storage, packaging and approved transport first. No rider connected yet.'})];
case 'orders':return [page('📋 My Orders','Mama, you wan see practice orders?',[],'Show orders',()=>{let o=data.practice||[];return o.length?o.map((x,i)=>(i+1)+'. '+x.qty+' akara — '+x.status).join('\n'):'No practice order yet. WhatsApp orders dey inside Mama WhatsApp, no automatic sync yet.'}),page('📋 My Orders','Add practice order?', [field('practiceQty','How many akara?','number',20)],'Save practice order',()=>{data.practice=data.practice||[];data.practice.push({qty:num('practiceQty'),status:'Practice only'});save();return 'Practice order saved for this phone. No real order sent.'})];
case 'grow':return [page('🌍 Reach Everywhere','From Benin City reach the world! How many rounds you fry?', [field('rounds','Rounds per day','number',2),field('days','Days per month','number',20)],'Show possibility',()=>{let sales=num('sold')*num('price')*num('rounds')*num('days');return 'If demand dey, possible monthly sales: '+money(sales)+'. Na example, no be guaranteed profit. Start with Benin buyers. Person for UK or anywhere fit order for family in Benin. Export food only after proper checks.'})];
default:return []}}
function render(){const s=steps[index];$('heading').textContent=s.title;$('question').textContent=s.question;$('fields').innerHTML=s.fields.join('');$('result').style.display='none';$('result').textContent='';$('step').textContent='Step '+(index+1)+' of '+steps.length;$('back').textContent=index?'⬅️ Back':'🏠 Home';$('next').textContent=s.action;$('next').disabled=false;completed=false}
let completed=false;
function open(m){mode=m;index=0;steps=build(m);$('home').hidden=true;$('work').hidden=false;$('work').style.display='flex';render()}
function home(){$('work').hidden=true;$('work').style.display='none';$('home').hidden=false;mode='';updateTiles()}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(b.dataset.go));$('homeBtn').onclick=home;
$('back').onclick=()=>{if(completed){completed=false;render()}else if(index){index--;render()}else home()};
$('next').onclick=()=>{if(completed){if(index<steps.length-1){index++;render()}else home();return}
document.querySelectorAll('#fields input,#fields select').forEach(el=>data[el.id]=el.value);save();let s=steps[index];if(s.run){try{$('result').textContent=s.run()}catch(e){$('result').textContent='Something no work. Try again, Mama.'} $('result').style.display='block';completed=true;$('next').textContent=index<steps.length-1?'Next ➡️':'🏠 Home';$('step').textContent='Result ready';return}
if(index<steps.length-1){index++;render()}else home()};
const tileCopy={money:['Check your money','Know wetin remain'],buy:['Benin people dey hungry 😋','Order for family from abroad'],beans:['Compare beans price','Check quality before buy'],carry:['Benin delivery first','Safe food, happy people'],orders:['Your practice orders','No automatic order sync'],grow:['Benin → The World 🌍','Grow small-small']};
function updateTiles(){document.querySelectorAll('#home [data-go]').forEach(btn=>{let key=btn.dataset.go,copy=tileCopy[key];if(!copy)return;let sub=btn.querySelector('small');if(!sub)return;let i=Number(btn.dataset.flip||0);sub.textContent=copy[i%copy.length];btn.dataset.flip=String(i+1)});let orders=document.querySelector('[data-go="orders"] small');if(orders&&(data.practice||[]).length)orders.textContent=(data.practice||[]).length+' practice orders'}
updateTiles();if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){setInterval(()=>{if(!mode)updateTiles()},6500)}
if(new URLSearchParams(location.search).has('mama')){data.phone=new URLSearchParams(location.search).get('mama');open('buy')}
</script><button id="osayiFab" type="button" aria-label="Talk to Osayi">🗣️ Ask Osayi</button><aside id="osayiChat" role="dialog" aria-modal="true" aria-label="Talk to Osayi"><header><span>🗣️ Osayi dey here ❤️</span><button id="osayiClose" type="button">✕ Close</button></header><div id="osayiLog" role="log" aria-live="polite"></div><div id="osayiQuick"><button id="osayiVoice" type="button" aria-pressed="false">🔇 Voice off</button><button id="osayiOpenFlow" type="button">🧭 Open suggested button</button><button data-ask="How my akara money?">💰 My money</button><button data-ask="How I take collect order?">🛍️ Orders</button><button data-ask="How I fit deliver for Benin?">🛵 Delivery</button><button data-ask="I wan sell to the world">🌍 Abroad</button></div><div id="osayiControls"><input id="osayiInput" aria-label="Your message to Osayi" placeholder="Mama, wetin you wan ask?" maxlength="220"><button id="osayiMic" type="button" aria-label="Speak to Osayi">🎙️</button><button id="osayiSend" type="button">Send</button></div><div id="osayiNote">Pidgin guided assistant · Device speech where supported · No live AI backend</div></aside><script id="osayi-conversation">
(()=>{const by=id=>document.getElementById(id),chat=by('osayiChat'),log=by('osayiLog'),inp=by('osayiInput');let turns=0,lastIntent='money',context={qty:null,price:null,cost:null};
function say(t,who){const p=document.createElement('p');p.textContent=t;if(who==='you')p.className='you';log.append(p);while(log.children.length>18)log.firstChild.remove();log.scrollTop=log.scrollHeight;if(who!=='you'&&window.speechSynthesis&&localStorage.getItem('osayiSpeak')==='yes'){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-NG';u.rate=.88;speechSynthesis.speak(u)}catch(e){}}}
function answer(raw){const t=raw.toLowerCase();if(/\b(hello|hi|how far|good morning|osayi)\b/.test(t)&&t.length<35)return 'Mama! I dey here o 😄 Wetin you wan do today? Money, customer order, beans, or delivery?';
if(/\b(money|profit|gain|sell|sales|make|earn|remain)\b/.test(t)){lastIntent='money';const nums=(t.match(/\d+(?:\.\d+)?/g)||[]).map(Number);if(nums.length>=3){const [qty,price,cost]=nums;context={qty,price,cost};return 'If you sell '+qty+' akara for ₦'+price+' each, and total cost na ₦'+cost+', money wey remain before other expenses na ₦'+Math.round(qty*price-cost).toLocaleString('en-NG')+'. Na estimate; confirm your real costs.'}return 'Mama, tell me 3 things: how many akara you sell, price for one, and total cost. Example: I sell 80 akara, ₦100 each, cost ₦4000. Or tap My Akara Money.'}
if(/\b(order|customer|buy|chop|hungry)\b/.test(t)){lastIntent='buy';return 'Sweet akara! 😄 Tap Who Wan Buy Akara, choose quantity and collection, then open WhatsApp. Customer must press Send; Mama go confirm price and availability. No automatic order yet.';}
if(/\b(bean|supplier|market|cheaper|price)\b/.test(t)){lastIntent='beans';return 'Mama, enter total cost for two beans suppliers inside Buy Better Beans. We go compare am. Quality and transport still matter o!';}
if(/\b(deliver|delivery|rider|carry|transport|send)\b/.test(t)){lastIntent='carry';return 'For Benin, start with nearby customers and confirm rider, fee and food safety yourself. No live rider booking yet. Tap Carry Akara Go.';}
if(/\b(world|abroad|uk|manchester|export|international|diaspora|lagos)\b/.test(t)){lastIntent='grow';return 'People for Manchester fit buy akara for family for Benin! 😄 For overseas food export, start with packaged products only after proper safety, customs and carrier checks.';}
if(/\b(what about|and if|how about|calculate again)\b/.test(t)&&context.qty!==null){const nums=(t.match(/\d+(?:\.\d+)?/g)||[]).map(Number);if(nums.length===1){context.qty=nums[0];return 'If na '+context.qty+' akara at ₦'+context.price+' each and ₦'+context.cost+' cost, estimated money wey remain na ₦'+Math.round(context.qty*context.price-context.cost).toLocaleString('en-NG')+'. Na estimate.'}}if(/\b(help|what can|wetin you fit)\b/.test(t))return 'I fit guide you on money, orders, beans, delivery and growth. I never connect to live AI or payments. Ask me one of these things.';
return 'Mama, I hear you, but I never understand that one well. Try ask about akara money, orders, beans, delivery or abroad. I no go pretend say I know wetin I no know.'}
function send(t){t=(t||inp.value).trim();if(!t)return;inp.value='';say(t,'you');say(answer(t),'osayi');turns++}
by('osayiFab').onclick=()=>{chat.classList.add('active');by('osayiFab').hidden=true;if(!turns)say('Mama, how far! 😄 Na Osayi. You fit type or talk to me. Wetin you wan do today?','osayi');inp.focus()};
by('osayiClose').onclick=()=>{chat.classList.remove('active');by('osayiFab').hidden=false;try{speechSynthesis.cancel()}catch(e){}};
const voice=by('osayiVoice');function updateVoice(){const on=localStorage.getItem('osayiSpeak')==='yes';voice.textContent=on?'🔊 Voice on':'🔇 Voice off';voice.setAttribute('aria-pressed',String(on))}updateVoice();voice.onclick=()=>{const on=localStorage.getItem('osayiSpeak')==='yes';localStorage.setItem('osayiSpeak',on?'no':'yes');updateVoice();if(!on)say('I go talk with you now, Mama.','osayi');else try{speechSynthesis.cancel()}catch(e){}};by('osayiOpenFlow').onclick=()=>{by('osayiClose').click();const tile=document.querySelector('[data-go="'+lastIntent+'"]');if(tile)tile.click()};by('osayiSend').onclick=()=>send();inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>send(b.dataset.ask));
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;const mic=by('osayiMic');if(SpeechRecognition){mic.onclick=()=>{try{const rec=new SpeechRecognition();rec.lang='en-NG';rec.interimResults=false;rec.onresult=e=>{inp.value=e.results[0][0].transcript;send()};rec.onerror=()=>say('Microphone no work. Type your question instead.','osayi');rec.start()}catch(e){say('Voice no available. Type am instead.','osayi')}}}else{mic.disabled=true;mic.title='Voice input not supported on this browser'}
})();
