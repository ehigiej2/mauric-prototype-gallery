name: Stephen Osayi research source gate
on:
  push:
    branches:
      - research/stephen-personal-journey-20261109
    paths:
      - 'stephen/osayi-unified-journey.html'
      - 'stephen/osayi-voice-layer.js'
      - 'tests/osayi-unified-journey-source-gate.cjs'
      - '.github/workflows/stephen-osayi-research-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node tests/osayi-unified-journey-source-gate.cjs
