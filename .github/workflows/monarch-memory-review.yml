name: MONARCH encrypted research POC checks (review only)
on:
  push:
    branches: [review/monarch-memory-poc-20261112]
    paths:
      - 'shared/secure-research-memory.js'
      - 'shared/mauric-prototype-research-adapter.js'
      - 'shared/mauric-synthetic-decision-ledger.js'
      - 'shared/osayi-research-memory-ui.js'
      - 'tests/test_secure_research_memory.cjs'
      - 'tests/test_mauric_prototype_research_adapter.cjs'
      - 'tests/test_mauric_synthetic_decision_ledger.cjs'
      - 'tests/test_monarch_memory_browser.py'
      - 'tests/test_monarch_memory_cross_tab.py'
      - 'monarch-trade-waka-review.html'
      - '.github/workflows/monarch-memory-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test synthetic encrypted research memory
        run: node tests/test_secure_research_memory.cjs
      - name: Test prototype isolation and reference handoffs
        run: node tests/test_mauric_prototype_research_adapter.cjs
      - name: Test explicit synthetic decision locks
        run: node tests/test_mauric_synthetic_decision_ledger.cjs
  browser-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        viewport: ['320x568', '375x667', '390x844']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Check Python test syntax
        run: python -m py_compile tests/test_monarch_memory_browser.py
      - name: Browser encrypted research acceptance
        env:
          WAKA_BROWSER: ${{ matrix.browser }}
          WAKA_VIEWPORT: ${{ matrix.viewport }}
        run: |
          mkdir -p test-evidence
          python tests/test_monarch_memory_browser.py 2>&1 | tee test-evidence/browser-result.log
          exit ${PIPESTATUS[0]}
      - name: Preserve browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-${{ matrix.browser }}-${{ matrix.viewport }}
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 7
  cross-tab-known-blocker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Known blocker — cross-tab delete/save race
        run: |
          mkdir -p test-evidence
          python tests/test_monarch_memory_cross_tab.py 2>&1 | tee test-evidence/cross-tab-result.log
          exit ${PIPESTATUS[0]}
      - name: Preserve cross-tab failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-tab-known-blocker
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 7
