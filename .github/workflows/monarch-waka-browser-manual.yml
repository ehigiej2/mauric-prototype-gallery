name: MONARCH Waka manual browser acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run synthetic browser acceptance
        run: python tests/test_monarch_waka_browser.py
