name: MONARCH Waka review browser acceptance
on:
  push:
    branches:
      - review/monarch-waka-q1-86
    paths:
      - monarch-trade-waka-review.html
      - tests/test_monarch_waka_browser.py
      - shared/monarch-control-engine.js
      - .github/workflows/monarch-waka-browser-manual.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-browser-tests:
    if: github.ref == 'refs/heads/review/monarch-waka-q1-86'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      WAKA_BROWSER: ${{ matrix.browser }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run synthetic browser acceptance
        run: python tests/test_monarch_waka_browser.py
      - name: Save synthetic layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waka-layout-${{ matrix.browser }}
          path: test-evidence/
          if-no-files-found: warn
          retention-days: 7
