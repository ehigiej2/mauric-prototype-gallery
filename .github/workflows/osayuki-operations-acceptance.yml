name: Osayuki Operations Acceptance
on:
  push:
    paths:
      - 'osayuki-benin-operations-assistant-v1.html'
      - 'engines/monarch-conversation-engine-v1.js'
      - 'engines/monarch-business-conversation-v1.js'
      - '.github/workflows/osayuki-operations-acceptance.yml'
  workflow_dispatch:
jobs:
  source-and-conversation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate six workflows, financial guardrails and shared conversation
        run: |
          node <<'JS'
          const fs=require('fs'),assert=require('assert'),vm=require('vm');
          const html=fs.readFileSync('osayuki-benin-operations-assistant-v1.html','utf8');
          for(const key of ['route','capacity','demand','economics','safety','brief']){
            assert(html.includes('data-view="'+key+'"'), 'Missing button '+key);
          }
          for(const fragment of ['id="researchForm"','id="calculate"','id="export"','id="ask"','id="stop"','Number.isSafeInteger','Number.isInteger(get(\'jobs\'))']){
            assert(html.includes(fragment),'Missing functionality '+fragment);
          }
          assert(html.includes('on_demand_synthesis_connected')===false,'Voice claims must be manifest-based');
          assert(html.includes("(fields[k]||['Completed jobs'"),'Decision Brief must support economics records');
          assert(html.includes('document.body.appendChild(a)'),'Safari export link must be attached');
          const context={console};context.globalThis=context;vm.createContext(context);
          for(const file of ['engines/monarch-conversation-engine-v1.js','engines/monarch-business-conversation-v1.js']){
            vm.runInContext(fs.readFileSync(file,'utf8'),context,{filename:file});
          }
          assert(context.MonarchBusinessConversation,'Shared adapter missing');
          const session=context.MonarchBusinessConversation.create({domain:'osayuki',sessionId:'acceptance'});
          const first=session.ask('What about route capacity?');
          assert(first.text.includes('UNKNOWN'),'Route evidence must not be invented');
          const second=session.ask('What did I ask before?');
          assert(second.text.includes('What about route capacity?'),'Recent-turn recall broken');
          const third=session.ask('What is profit?',{sales:50000,cost:36000});
          assert(third.text.includes('14,000'),'Modelled contribution incorrect');
          assert(session.speech().status==='BLOCKED','Unapproved synthesis must remain blocked');
          console.log('PASS: six buttons, guards, shared Osayi, memory, arithmetic, voice hold');
          JS
