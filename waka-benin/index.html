<!doctype html><html lang='en'><meta name='viewport' content='width=device-width,initial-scale=1'><meta charset='utf-8'><title>MONARCH WAKA Benin Driver</title><style>body{font:18px system-ui;background:#edf4ff;color:#143254;margin:0}main{max-width:640px;margin:auto;padding:16px}header{background:#103c89;color:white;padding:24px;border-radius:24px}section{background:white;padding:20px;border-radius:22px;margin-top:14px}button,a{display:block;box-sizing:border-box;width:100%;padding:19px;border:0;border-radius:18px;background:#1767c4;color:white;font:bold 19px system-ui;text-decoration:none;text-align:center;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid button{min-height:118px;margin:0}.grid button:nth-child(1){background:#07885a}.grid button:nth-child(2){background:#226ac8}.grid button:nth-child(3){background:#b87813}.grid button:nth-child(4){background:#7845b5}.grid button:nth-child(5){background:#b13b7a}.grid button:nth-child(6){background:#087c8a}.light{background:#e5effb;color:#16416d}.job{padding:14px;border:1px solid #d4e0ef;border-radius:14px;margin:12px 0}small{color:#617188}</style><main><header>👑 MONARCH × MAURIC<h1>🛵 WAKA DRIVER</h1>Benin City · Osayi dey with you<p>FIELD TEST · SIMULATED JOBS</p></header><section id='home'><h2>Wetin you wan do?</h2><div class='grid'><button onclick="view('jobs')">📲 Find Jobs</button><button onclick="view('delivery')">🛵 My Delivery</button><button onclick="view('map')">🧭 Osayi Map</button><button onclick="view('money')">💰 My Money</button><button onclick="view('today')">📊 Today Work</button><button onclick="view('help')">🤖 Ask Osayi</button></div></section><section id='panel' hidden><h2 id='heading'></h2><div id='content'></div><button class='light' onclick='home()'>🏠 All six buttons</button></section><section><p id='status' role='status'>🤖 Osayi: Choose one big button, my person.</p><small>No real dispatch, GPS, payments or confirmed earnings. Do not interact while riding.</small></section></main><script>const jobs=[['Ugbowo','Ring Road',4200,850],['Airport Road','Sapele Road',5200,1250],['Aduwawa','New Benin',3600,800]];let s={active:-1,stage:0,done:[]};try{s=JSON.parse(localStorage.getItem('waka-benin-field'))||s}catch(e){}const el=id=>document.getElementById(id),cash=n=>'₦'+n.toLocaleString('en-NG');function save(){try{localStorage.setItem('waka-benin-field',JSON.stringify(s))}catch(e){}}function say(t){el('status').textContent='🤖 Osayi: '+t}function home(){el('home').hidden=false;el('panel').hidden=true}function view(p){el('home').hidden=true;el('panel').hidden=false;el('heading').textContent=({jobs:'📲 Find Jobs',delivery:'🛵 My Delivery',map:'🧭 Osayi Map',money:'💰 My Money',today:'📊 Today Work',help:'🤖 Ask Osayi'})[p];let h='';if(p==='jobs')h=jobs.map((j,i)=>'<div class=job><b>'+j[0]+' → '+j[1]+'</b><p>Example customer price: '+cash(j[2])+'<br>Illustrative rider share (90%): '+cash(Math.round(j[2]*.9))+'<br>Estimated cost: '+cash(j[3])+'<br>Estimated remainder: '+cash(Math.round(j[2]*.9)-j[3])+'</p><button onclick="accept('+i+')">Accept job</button><button class=light onclick="say(\'Example job declined.\')">Decline</button></div>').join('');if(p==='delivery'){let j=jobs[s.active];h=j?'<p>'+j[0]+' → '+j[1]+'</p><p>'+(s.stage?'Parcel collected · Go to customer':'Accepted · Go to pickup')+'</p><button onclick="view(\'map\')">🧭 Check map</button><button onclick="advance()">'+(s.stage?'🏁 Confirm delivery':'📦 Confirm pickup')+'</button><button class=light onclick="say(\'Example issue noted. No real agent contacted.\')">⚠️ Report issue</button><button class=light onclick="cancel()">Cancel job</button>':'No active job.<button onclick="view(\'jobs\')">Find jobs</button>'}if(p==='map')h='<p>Open the separate OSAYI road-routing research prototype. Its sample route may not match this job.</p><a href="../osayi-navigator/" target="_blank" rel="noopener">🧭 Open Osayi Navigator</a><small>Route availability, traffic and hazards are unverified.</small>';if(p==='money'){let revenue=s.done.reduce((n,i)=>n+Math.round(jobs[i][2]*.9),0),cost=s.done.reduce((n,i)=>n+jobs[i][3],0);h='<p>Example rider share: '+cash(revenue)+'</p><p>Estimated costs: '+cash(cost)+'</p><h3>Estimated remainder: '+cash(revenue-cost)+'</h3><small>No actual wallet or payment.</small>'}if(p==='today')h='<p>Completed simulated deliveries: '+s.done.length+'</p>'+s.done.map(i=>'<p>'+jobs[i][0]+' → '+jobs[i][1]+'</p>').join('')+'<button class=light onclick="reset()">↻ Reset demo</button>';if(p==='help')h='<p>My person: Find Jobs → Check money → Accept → Check map → Confirm pickup → Confirm delivery → My Money.</p><button onclick="say(\'Na practice app. No real job or payment yet.\')">Is this real?</button>';el('content').innerHTML=h}function accept(i){if(s.active!==-1){say('Finish or cancel current job first.');view('delivery');return}s.active=i;s.stage=0;save();say('Example job accepted.');view('delivery')}function advance(){if(s.active===-1)return;if(!s.stage){s.stage=1;say('Example parcel collected.');save();view('delivery')}else{s.done.push(s.active);s.active=-1;s.stage=0;save();say('Example delivery completed.');view('money')}}function cancel(){s.active=-1;s.stage=0;save();say('Example job cancelled.');view('jobs')}function reset(){if(!confirm('Reset all simulated work?'))return;s={active:-1,stage:0,done:[]};save();home()}</script>
