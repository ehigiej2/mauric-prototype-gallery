<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gate 145 · Voice cancellation adversarial test</title><style>body{font:16px system-ui;background:#eef5f2;color:#173d36;padding:18px;max-width:850px;margin:auto}button{padding:14px;background:#096c5d;color:white;border:0;border-radius:12px;font:700 16px system-ui}pre{white-space:pre-wrap;background:white;padding:15px;border-radius:12px}iframe{width:100%;height:400px;border:1px solid #bcd4c9}</style><h1>👑 Gate 145 · Adversarial voice tests</h1><p>Zero real microphone use. A fake browser recognition service delivers deterministic callbacks. Research-only: this does NOT prove real Safari voice, privacy, or network behaviour.</p><button id="run">Run simulated voice tests</button><pre id="out">Not run</pre><iframe id="frame" title="Simulated voice test prototype"></iframe><script>"use strict";document.getElementById("run").onclick=async()=>{const out=document.getElementById("out"),f=document.getElementById("frame"),checks=[];const check=(name,ok)=>checks.push((ok?"PASS ":"FAIL ")+name);try{const response=await fetch("./osayi-aduwawa-north-gate128.html",{cache:"no-store"});if(!response.ok)throw Error("Prototype unavailable: HTTP "+response.status);let html=await response.text();const mock='<script>window.__fakeInstances=[];window.SpeechRecognition=class{constructor(){this.lang="";window.__fakeInstances.push(this)}start(){this.started=true}abort(){this.aborted=true;if(this.onend)this.onend()}emit(t){if(this.onresult)this.onresult({results:[[{transcript:t}]]})}};<\/script>';html=html.replace(/<script>/,mock+"<script>");if(!html.includes("window.__fakeInstances"))throw Error("Mock injection failed");f.srcdoc=html;await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error("Frame timeout")),8000);f.onload=()=>{clearTimeout(t);resolve()}});const w=f.contentWindow,d=f.contentDocument,$=id=>d.getElementById(id),click=id=>$(id).click();check("fake recognizer installed",typeof w.SpeechRecognition==="function");check("consent initially off",!$("voiceConsent").checked);click("listen");check("no consent blocks recognition",w.__fakeInstances.length===0&&$("voiceStatus").textContent.includes("BLOCKED"));$("voiceConsent").checked=true;click("listen");check("consent allows one recognition session",w.__fakeInstances.length===1&&w.__fakeInstances[0].started);check("consent resets on start",!$("voiceConsent").checked);const first=w.__fakeInstances[0];click("stoplisten");check("stop aborts recognition",first.aborted);const prev=$("response").textContent;first.emit("calculate cost");check("late transcript ignored after stop",$("response").textContent===prev);$("voiceConsent").checked=true;click("listen");check("second session created",w.__fakeInstances.length===2);const second=w.__fakeInstances[1];second.emit("stock");check("spoken stock intent routed",$("response").textContent.includes("never get verified stock"));check("single utterance stops recognition",second.aborted);check("transcript not shown",$("heard").textContent.indexOf("stock")<0);const after=$("response").textContent;second.emit("calculate cost");check("second transcript ignored after first utterance",$("response").textContent===after);check("new consent required",!$("voiceConsent").checked);out.textContent=checks.join("\n")+"\n"+checks.filter(x=>x.startsWith("PASS")).length+"/"+checks.length+" synthetic checks. Does not replace independent device testing."}catch(e){out.textContent="BLOCKED: "+e.message+"\nNo tests claimed passed."}};</script></html>
