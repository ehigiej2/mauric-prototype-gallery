<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONARCH China Direct research</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#192a43;font:17px system-ui}main{max-width:760px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:12px;font-size:13px}h1{font-size:30px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}button{font:inherit;cursor:pointer;border:0;border-radius:20px;padding:22px;color:#162a46;background:#d8e7ff;min-height:84px;font-weight:700}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #0064d8;outline-offset:3px}.grid button:nth-child(2){background:#ffe0cf}.grid button:nth-child(3){background:#cff0df}.grid button:nth-child(4){background:#e8ddfc}.grid button:nth-child(5){background:#ffedb5}.grid button:nth-child(6){background:#c9eef1}small{font-size:13px}section{background:white;border-radius:20px;padding:20px;margin-top:14px}label{display:block;margin:14px 0}input,select,textarea{display:block;width:100%;padding:12px;font:inherit;border:1px solid #74829a;border-radius:8px}article{border-top:1px solid #ddd;padding:12px 0}a{color:#0752a3}button.back{padding:10px;min-height:44px}p{line-height:1.5}[hidden]{display:none!important}.status{padding:12px;background:#fff0cd;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-height:650px){h1{font-size:24px;margin:12px 0}.grid button{min-height:72px;padding:14px}main{padding:14px}}</style><main><header><b>👑 MONARCH</b><span>Research · CROWN HOLD</span></header><div id="home"><h1>Watein you wan do?</h1><p>China choices. Clear evidence. Your decision.</p><nav class="grid" aria-label="Six main actions"><button data-page="shop">👕 Shop</button><button data-page="kids">🌱 Kids</button><button data-page="phones">📱 Phones</button><button data-page="laptops">💻 Laptops</button><button data-page="delivery">🚚 Delivery</button><button data-page="osayi">💬 Ask Osayi</button></nav><p><small>Research only. No live inventory, voice, orders or payments.</small></p></div><section id="panel" hidden aria-live="polite"></section></main><script src="cost-engine.js"></script><script src="review-engine.js"></script><script src="review-ui.js"></script><script>
const home=document.getElementById('home'),panel=document.getElementById('panel');let suppliers=[];
const titles={shop:'Solid-colour adult clothing',kids:'Children’s everyday essentials',phones:'Cases first. Phones need further checks.',laptops:'New laptops: evidence first',delivery:'Compare the complete delivered cost',osayi:'Osayi — guided research'};
const labels={goods:'Product cost',china_transport:'China domestic transport',handling:'Warehouse handling',inspection:'Inspection',freight:'International freight',insurance:'Insurance',duty:'Import duties',vat:'Import VAT',levies:'Other import levies',clearance:'Clearance',nigeria_delivery:'Benin City delivery',payment_fx:'Payment / FX costs',returns_defects:'Expected returns / defects cost',accepted_units:'Expected accepted whole units'};
function node(tag,t){const n=document.createElement(tag);if(t!==undefined)n.textContent=t;return n}function add(t){panel.append(node('p',t))}function back(){home.hidden=false;panel.hidden=true;document.querySelector('[data-page]').focus()}
function show(page){home.hidden=true;panel.hidden=false;panel.replaceChildren();const b=node('button','← Back to six buttons');b.className='back';b.onclick=back;panel.append(b,node('h2',titles[page]));if(page==='delivery'){const choice=node('button','Compare import with Nigerian alternative');choice.onclick=()=>{panel.replaceChildren();const b=node('button','← Back to six buttons');b.onclick=back;panel.append(b,node('h2','Prepare an owner decision brief'));reviewWorkflow()};panel.append(choice);calculator();return}if(page==='osayi'){osayi();return}
if(page==='kids')add('School bags: import hold pending exact lawful classification. Compare local Nigerian supply. Initial clothing research is daywear; safety evidence still required.');
if(page==='laptops')add('No authorised laptop supplier verified. Require exact new model, CPU/RAM/storage/OS, serial, warranty valid in Nigeria, battery carriage and applicable regulatory evidence.');
if(page==='phones')add('No authorised smartphone channel verified. NCC model approval, applicable licensing/device verification, provenance and Nigeria warranty remain release gates. Cases below are unverified supplier leads.');
const cat=page==='shop'?'adult':page==='kids'?'kids':page==='phones'?'case':'none';for(const s of suppliers.filter(s=>s.category===cat)){const a=node('article');a.append(node('h3',s.name),node('p',s.risk),node('p',s.rfq_status));const link=node('a','Public supplier source');link.href=s.url;link.target='_blank';link.rel='noopener noreferrer';a.append(link);panel.append(a)}add('Legal identity, live inventory, order-by-order fulfilment and landed price: UNKNOWN. Prepare → owner review → recorded; no order is placed.');}
function calculator(){add('Planning calculation only. Use one currency and itemised non-overlapping costs. Never use zero for an unknown. Even completed inputs remain SIMULATED until independently checked. Duty/VAT are entered after exact classification; this tool does not determine taxes.');const f=node('form');const cur=node('label','Currency');const sel=node('select');sel.id='currency';['NGN','USD','CNY'].forEach(c=>{const o=node('option',c);o.value=c;sel.append(o)});cur.append(sel);f.append(cur);for(const key of CostEngine.fields.concat('accepted_units')){const l=node('label',labels[key]);const i=node('input');i.id=key;i.type='number';i.min='0';i.step=key==='accepted_units'?'1':'any';i.placeholder='UNKNOWN';l.append(i);f.append(l)}const l=node('label','Source references / assumptions (no personal data)');const inp=node('input');inp.id='evidence';l.append(inp);f.append(l);const b=node('button','Calculate planning total');b.type='submit';const out=node('p','UNKNOWN — awaiting inputs');out.id='result';out.setAttribute('role','status');f.append(b,out);f.noValidate=true;f.onsubmit=e=>{e.preventDefault();const input={currency:sel.value,evidence:inp.value};CostEngine.fields.concat('accepted_units').forEach(k=>input[k]=document.getElementById(k).value);const r=CostEngine.calculate(input);out.textContent=r.status==='SIMULATED'?`SIMULATED ${r.currency} total ${r.total.toFixed(2)}; per accepted unit ${r.unit.toFixed(2)}. Not an approved quotation.`:r.status+' — complete all costs, sources and positive whole units.'};panel.append(f)}
function osayi(){add('Scripted guidance in Pidgin / English. No live conversational model or voice.');const l=node('label','Language');const sel=node('select');['Pidgin','English'].forEach(t=>sel.append(node('option',t)));l.append(sel);const prompt=node('p');const update=()=>prompt.textContent=sel.value==='Pidgin'?'First, choose exact cloth or phone model. How many you need? Na Benin City we dey deliver? We go check full cost and evidence before owner review. We never send supplier message.':'Choose the exact product, quantity and destination. We will compare full delivered costs and evidence before owner review. Supplier enquiries have not been sent.';sel.onchange=update;panel.append(l,prompt);update();const link=node('a','Read founder decision brief');link.href='ACTION-AND-DECISION-BRIEF.md';panel.append(link)}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));fetch('suppliers.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(s=>suppliers=s).catch(()=>{const p=node('p','Supplier data unavailable. No supplier facts or prices can be confirmed.');p.setAttribute('role','alert');home.append(p)});
</script></html>
