<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mark • MONARCH</title><style>body{font:17px system-ui;background:#f2f7fa;color:#142b40;max-width:650px;margin:auto;padding:20px}h1{margin-bottom:4px}main{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font: bold 19px system-ui;color:white;border:0;border-radius:20px;min-height:110px;padding:14px;cursor:pointer}section{background:white;padding:18px;border-radius:20px;margin-top:15px}input,textarea{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;font:inherit;border:1px solid #aaa;border-radius:10px}section button{min-height:48px;background:#174c87;width:100%;margin-top:8px}small{display:block;margin:15px 0}</style><h1>👑 Welcome, Mark</h1><p>MONARCH • Nottingham & UK</p><main id="tiles"></main><section id="panel" hidden><h2 id="heading"></h2><p id="desc"></p><form id="form"></form><p id="result" role="status"></p><button id="share" hidden>Share summary</button></section><small>Prototype only. No appointments, payments or live market data. Recruitment interest is free. Do not enter personal details without consent. Records stay in this session unless you choose to share.</small><script>const flows=[['My Operations','📋','#174c87','Plan your local operations',['Area','Priority','Next action']],['Recruit My Team','🤝','#16865c','£0 joining fee. Invite trustworthy people to express interest; roles subject to approval.',['Role','Area','Experience sought','Number of candidates']],['Find Businesses','🏪','#7049a5','Identify 10 independent businesses to approach',['Business type','Area','Business count','Support needed']],['Find Opportunities','🔎','#996919','Record a potential commercial opportunity',['Opportunity','Source or public link','Next action']],['Help Businesses Grow','📈','#087d89','Estimate a potential saving using your own figures',['Business type','Current monthly cost (£)','Proposed monthly cost (£)']],['My Performance','🏆','#b45838','Review activities in this session',[]]];let records=[],active,summary='';const el=id=>document.getElementById(id);flows.forEach((f,i)=>{let b=document.createElement('button');b.style.background=f[2];b.textContent=f[1]+' '+f[0];b.onclick=()=>open(i);el('tiles').append(b)});function open(i){active=i;let f=flows[i];el('panel').hidden=false;el('heading').textContent=f[0];el('desc').textContent=f[3];el('form').replaceChildren();el('result').textContent='';el('share').hidden=true;if(i===5){summary=records.length+' activities completed in this session.\n'+records.join('\n');el('result').textContent=summary;el('share').hidden=false;return}f[4].forEach(n=>{let l=document.createElement('label');l.textContent=n;let x=document.createElement('input');x.required=true;x.name=n;if(n.includes('£')||n.includes('count')||n.includes('Number')){x.type='number';x.min=0;x.step='any'}l.append(x);el('form').append(l)});let b=document.createElement('button');b.textContent='Save in this session';el('form').append(b)}el('form').onsubmit=e=>{e.preventDefault();let data=[...new FormData(e.target)];summary=flows[active][0]+': '+data.map(x=>x.join(': ')).join('; ');if(active===4)summary+='; Estimated monthly saving £'+(Number(data[1][1])-Number(data[2][1])).toFixed(2);records.push(summary);el('result').textContent=summary;el('share').hidden=false};el('share').onclick=()=>{if(navigator.share)navigator.share({text:summary}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(summary),'_blank','noopener')};</script></html>
