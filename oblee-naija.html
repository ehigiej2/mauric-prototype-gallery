<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183e35"><title>OBLEE | MONARCH × MAURIC</title><style>*{box-sizing:border-box}body{margin:0;background:#fff9ee;color:#183e35;font:18px system-ui,-apple-system,sans-serif}main{max-width:680px;margin:auto;padding:12px}.hero{background:#183e35;color:#fff;border-radius:24px;padding:20px;margin-bottom:12px}.hero small{color:#ffda87;font-weight:800}.hero h1{font-size:36px;margin:10px 0 5px}.hero p{margin:0;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:0;border-radius:22px;background:var(--c);color:#fff;min-height:134px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font:800 22px system-ui;cursor:pointer;text-align:center}.tile .emoji{font-size:40px}.tile.active{grid-column:1/-1;min-height:74px;border-radius:22px 22px 0 0;flex-direction:row}.tile.active .emoji{font-size:28px}.panel{grid-column:1/-1;background:#fff;border:3px solid #168b7d;border-radius:0 0 20px 20px;padding:14px}.hidden{display:none!important}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{background:#e7f2ed;color:#17483c;border:0;border-radius:15px;padding:12px;min-height:66px;font:800 17px system-ui}.choice.chosen{background:#147f70;color:#fff}.field{width:100%;border:2px solid #b9cfc5;border-radius:14px;padding:13px;font:18px system-ui;margin:6px 0 10px}.action{width:100%;border:0;border-radius:15px;background:#167e6d;color:#fff;font:800 18px system-ui;padding:15px;margin-top:9px}.secondary{background:#bd5083}.fine{font-size:13px;color:#52665e;margin:14px 5px}a{color:inherit}button:focus-visible,input:focus-visible{outline:4px solid #161d1a;outline-offset:2px}</style></head><body><main><header class="hero"><small>👑 MONARCH × MAURIC · NAIJA</small><h1>🎉 OBLEE!</h1><p>Wetin you wan flex? 🥳</p></header><div class="grid" id="grid"></div><p class="fine">Demo only · No live bookings or venue partnerships yet · Confirm prices and availability directly with venues · No payment collected</p><a href="index.html">← MONARCH Home</a></main><script>const data=[["🍾","Book Table","#b23b81",["Table for two","Friends & crew","VIP section"]],["🎂","Plan Party","#e18a20",["Birthday","Owambe","After-party"]],["🎶","Music & DJ","#6455b8",["Live band","DJ night","Karaoke"]],["🍗","Food & Drinks","#168b7d",["Small chops","Naija food","Drinks menu"]],["🚕","Safe Ride","#256fbc",["Ride to venue","Ride home","Designated driver"]],["📍","Where to Flex","#d0505e",["Benin City","Lagos","Other city"]]];const grid=document.getElementById('grid');let selected='',detail='';data.forEach(([emoji,title,color,opts])=>{const b=document.createElement('button');b.type='button';b.className='tile';b.style.setProperty('--c',color);b.innerHTML='<span class="emoji">'+emoji+'</span><span>'+title+'</span>';const panel=document.createElement('section');panel.className='panel hidden';panel.innerHTML='<div class="choices"></div><div class="details hidden"><p><b>Which city?</b></p><input class="field city" placeholder="e.g. Benin City" aria-label="City"><p><b>Venue (optional)</b></p><input class="field venue" placeholder="Roots, Eclipse, Next Level, Grasshopper…" aria-label="Venue"><button type="button" class="action share">🤝 Share my plan</button><button type="button" class="action secondary search">🔎 Find venues</button></div>';const choices=panel.querySelector('.choices');opts.forEach(opt=>{const c=document.createElement('button');c.className='choice';c.type='button';c.textContent=opt;c.onclick=()=>{choices.querySelectorAll('button').forEach(y=>y.classList.remove('chosen'));c.classList.add('chosen');selected=title;detail=opt;panel.querySelector('.details').classList.remove('hidden');panel.querySelector('.city').focus()};choices.appendChild(c)});panel.querySelector('.share').onclick=()=>{const city=panel.querySelector('.city').value.trim()||'City to confirm';const venue=panel.querySelector('.venue').value.trim()||'Venue to confirm';const msg='🎉 OBLEE!\n'+selected+' — '+detail+'\n📍 '+city+'\n🍾 '+venue+'\nPlease confirm availability, price and details directly with the venue.\nExplore: https://ehigiej2.github.io/mauric-prototype-gallery/oblee-naija.html';location.href='https://wa.me/?text='+encodeURIComponent(msg)};panel.querySelector('.search').onclick=()=>{const city=panel.querySelector('.city').value.trim()||'Nigeria';const venue=panel.querySelector('.venue').value.trim();location.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((venue||'restaurants bars clubs')+' '+city)};b.onclick=()=>{const active=b.classList.contains('active');grid.querySelectorAll('.tile').forEach(x=>x.classList.remove('active'));grid.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));if(!active){b.classList.add('active');panel.classList.remove('hidden')}};grid.append(b,panel)});</script></body></html>
