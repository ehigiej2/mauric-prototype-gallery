<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IK • MONARCH</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#122e45;font:17px system-ui}main{max-width:650px;margin:auto;padding:16px}header{background:#102c45;color:white;border-radius:22px;padding:22px}h1{font-size:29px;margin:8px 0}small{color:#d8e4ef}strong{color:#ffdb88}nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}button,a.action{font:inherit;font-weight:700;border:0;border-radius:15px;padding:16px;color:white;background:#153d61;cursor:pointer;text-align:center;display:block;text-decoration:none}nav button{min-height:95px;font-size:19px}section{background:white;padding:18px;border-radius:18px}label{display:block;margin:12px 0}input,textarea,select{display:block;width:100%;font:inherit;padding:12px;border:1px solid #9caebd;border-radius:9px;margin-top:4px}output{display:block;font-weight:bold;margin:12px 0}section button{width:100%;margin:8px 0}footer{font-size:13px;margin:15px 0}li{margin:8px 0}</style><main><header><small>👑 MONARCH × MAURIC</small><h1>IK, how far? 😂</h1><div>Your business first. Agent joining fee <strong>₦0</strong></div></header><nav id="nav"></nav><section id="panel" hidden></section><footer>MONARCH AEON GLOBAL TECHNOLOGIES LTD • RC 10008047 • Planning prototype. No live prices, bookings or payments. Data entered here is not transmitted automatically.</footer></main><script>

];const nav=document.getElementById('nav'),panel=document.getElementById('panel');let current=0;const saved={};function openFlow(i){current=i;let f=flows[i];panel.hidden=false;panel.innerHTML='';let h=document.createElement('h2');h.textContent=f[2];panel.append(h);let p=document.createElement('p');p.textContent=f[3];panel.append(p);let form=document.createElement('form');f[4].split('|').forEach((field,j)=>{let [name,type]=field.split(':');let l=document.createElement('label');l.textContent=name;let e;if(type==='select'||type==='mission'){e=document.createElement('select');(type==='select'?['Not decided','Yes','No']:['Cement suppliers','Hotels and Pads','Hallmark and shops','Mama Akara','Recruitment and promotion','Eastern traders','China suppliers','Help Me Go']).forEach(x=>e.add(new Option(x,x)));}else{e=document.createElement('input');e.type=type||'text';if(type==='number'){e.min='0';e.step='any';}}e.name=name;e.value=saved[i]?.[name]||e.value;e.oninput=()=>{saved[i]=Object.fromEntries(new FormData(form));calc();};l.append(e);form.append(l);});panel.append(form);let out=document.createElement('output');panel.append(out);function calc(){let a=[...form.elements];let n=k=>Number(a[k]?.value);if(i===0&&[2,3,4,5].every(k=>a[k].value!==''))out.textContent='Estimated monthly trading margin: ₦'+(n(2)*(n(4)-n(3)-n(5))).toLocaleString('en-NG');else if(i===1&&n(2)>0&&a[3].value!==''&&a[4].value!=='')out.textContent='Landed cost per bag: ₦'+((n(3)+n(4))/n(2)).toLocaleString('en-NG',{maximumFractionDigits:2});else out.textContent='';}calc();let note=document.createElement('p');note.textContent=f[5];panel.append(note);let b=document.createElement('button');b.textContent='Share my report';b.onclick=()=>{let msg='MONARCH • IK • '+f[2]+'\n'+[...new FormData(form)].map(([k,v])=>k+': '+v).join('\n')+'\nPlanning only; approval required.';if(navigator.share)navigator.share({text:msg}).catch(()=>{});else location.href='https://wa.me/?text='+encodeURIComponent(msg);};panel.append(b);let back=document.createElement('button');back.textContent='Back to home';back.onclick=()=>{panel.hidden=true;window.scrollTo(0,0)};panel.append(back);panel.scrollIntoView({behavior:'smooth'});}flows.forEach((f,i)=>{let b=document.createElement('button');b.textContent=f[0];b.style.background=f[1];b.onclick=()=>openFlow(i);nav.append(b);});</script></html>
