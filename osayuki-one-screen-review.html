<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143c72"><title>Osayuki | One Screen Review</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#edf3fb;color:#17324e}button,input,textarea,select{font:inherit}button{cursor:pointer}.home{height:100dvh;min-height:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 10px);gap:10px;overflow:hidden}.heading{flex:none;background:#143c72;color:white;border-radius:18px;padding:12px 16px}.heading small{font-size:11px;letter-spacing:.1em}.heading h1{font-size:clamp(19px,5vw,27px);margin:3px 0}.heading p{font-size:12px;margin:0}.tiles{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:10px}.tile{border:0;border-radius:20px;padding:8px;background:var(--c);color:#15324e;font-weight:800;font-size:clamp(14px,3.8vw,19px);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;box-shadow:0 2px 7px #193a601c}.tile span{font-size:clamp(24px,7vw,38px);margin-bottom:4px}.tile:focus-visible,.back:focus-visible{outline:3px solid #173b7c;outline-offset:2px}.foot{flex:none;text-align:center;font-size:10px;color:#415b75}.work{height:100dvh;overflow:auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);max-width:650px;margin:auto}.work h2{margin:12px 0}.back,.action{background:#173f7a;color:white;border:0;border-radius:13px;padding:12px 16px;font-weight:700}.panel{background:white;padding:16px;border-radius:18px;margin:12px 0;box-shadow:0 2px 9px #1c47751a}.panel label{display:block;margin:10px 0 5px;font-weight:600}.panel input,.panel textarea,.panel select{width:100%;padding:12px;border:1px solid #b9c8d7;border-radius:10px}.panel textarea{min-height:80px}.note{font-size:13px;color:#465f78}.result{white-space:pre-wrap;background:#f1f6ff;border-radius:12px;padding:12px;margin-top:12px}.hidden{display:none!important}@media(max-height:560px){.home{gap:6px;padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}.heading{padding:6px 12px}.heading h1{font-size:18px}.heading p{display:none}.tiles{gap:6px}.tile{border-radius:12px}.tile span{font-size:22px;margin-bottom:0}.foot{display:none}}</style></head><body><main id="home" class="home"><header class="heading"><small>👑 OSAYUKI EDOSA · RESEARCH</small><h1>Watein you wan do?</h1><p>Tap one button. Everything else dey inside.</p></header><nav class="tiles" aria-label="Six main actions"><button class="tile" style="--c:#dbeaff" data-go="route"><span aria-hidden="true">🚌</span>Check Route</button><button class="tile" style="--c:#def4e8" data-go="capacity"><span aria-hidden="true">🚚</span>Find Space</button><button class="tile" style="--c:#fff0d3" data-go="buyers"><span aria-hidden="true">🛍️</span>Find Buyers</button><button class="tile" style="--c:#efe4ff" data-go="money"><span aria-hidden="true">💰</span>Check Money</button><button class="tile" style="--c:#ffe1dc" data-go="safety"><span aria-hidden="true">🛡️</span>Check Safety</button><button class="tile" style="--c:#ddf3f2" data-go="report"><span aria-hidden="true">📋</span>My Report</button></nav><div class="foot">Fictional research only · No live bookings or payments</div></main><main id="work" class="work hidden"><button class="back" id="back">← Six big buttons</button><h2 id="title"></h2><div id="content"></div></main><script>
"use strict";
const store={route:[],capacity:[],buyers:[],safety:[],money:[],chat:[]};let active="route";
const names={route:"🚌 Check Route",capacity:"🚚 Find Space",buyers:"🛍️ Find Buyers",money:"💰 Check Money",safety:"🛡️ Check Safety",report:"📋 My Report"};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function openWork(k){active=k;document.getElementById("home").classList.add("hidden");document.getElementById("work").classList.remove("hidden");document.getElementById("title").textContent=names[k];render();window.scrollTo(0,0)}
function home(){document.getElementById("work").classList.add("hidden");document.getElementById("home").classList.remove("hidden");window.scrollTo(0,0)}
function form(k,labels){return '<div class="panel"><p class="note">Research simulation only. Use fictional details.</p><form id="entry">'+labels.map((l,i)=>'<label for="f'+i+'">'+l+'</label><input id="f'+i+'" name="f'+i+'" required maxlength="140" placeholder="Fictional example">').join('')+'<p><button class="action">Save research note</button></p></form></div><div class="panel"><strong>Saved this session: '+store[k].length+'</strong><div class="result">'+(store[k].length?store[k].map((v,i)=>(i+1)+'. '+v.map(esc).join(' · ')).join('\n'):'No notes yet')+'</div></div>'}
function assistant(){return '<details class="panel"><summary><strong>🤖 Ask Osayi (text help)</strong></summary><p class="note">Guidance is scripted, not live AI or voice. No data is sent to a server.</p><label for="question">Wetin you wan ask?</label><input id="question" maxlength="200" placeholder="e.g. Wetin I need check?"><p><button class="action" id="ask" type="button">Ask Osayi</button></p><div id="answer" class="result" aria-live="polite">Ask a question to see guidance.</div></details>'}
function render(){let c='';if(active==="route")c=form("route",["Fictional route","Observed issue or opportunity"]);if(active==="capacity")c=form("capacity",["Fictional vehicle or rider","Available space and time"]);if(active==="buyers")c=form("buyers",["Fictional product or service","Buyer demand hypothesis"]);if(active==="safety")c=form("safety",["Safety or permission issue","Proposed safeguard"]);if(active==="money")c='<div class="panel"><p class="note">Illustrative unit economics, not a price quotation.</p><form id="calc"><label for="revenue">Expected revenue (₦)</label><input id="revenue" type="number" min="0" max="100000000" step=".01" required><label for="cost">Total cost (₦)</label><input id="cost" type="number" min="0" max="100000000" step=".01" required><p><button class="action">Calculate</button></p></form><div class="result" id="calcresult">Enter fictional amounts.</div></div>';if(active==="report")c='<div class="panel"><p>Session-only research summary. No live operational records.</p><div class="result" id="brief">'+Object.entries(store).filter(([k])=>k!=="chat").map(([k,v])=>names[k]+": "+v.length+" record(s)").join('\n')+'</div><p><button class="action" id="copy" type="button">Copy decision brief</button></p><p class="note" id="copymsg"></p></div>';document.getElementById("content").innerHTML=c+assistant();const entry=document.getElementById("entry");if(entry)entry.addEventListener("submit",e=>{e.preventDefault();const v=[...entry.querySelectorAll("input")].map(x=>x.value.trim());if(v.every(Boolean)){store[active].push(v);render()}});const calc=document.getElementById("calc");if(calc)calc.addEventListener("submit",e=>{e.preventDefault();const a=Number(document.getElementById("revenue").value),b=Number(document.getElementById("cost").value);if(!Number.isFinite(a)||!Number.isFinite(b)||a<0||b<0)return;const net=a-b;store.money.push([a,b,net]);document.getElementById("calcresult").textContent="Revenue: ₦"+a.toLocaleString()+"\nCost: ₦"+b.toLocaleString()+"\nIllustrative net: ₦"+net.toLocaleString()+"\n"+(net<0?"Loss scenario — review before any action.":"Non-negative scenario — verification still required.")});const ask=document.getElementById("ask");ask.addEventListener("click",()=>{const q=document.getElementById("question").value.trim();if(!q)return;store.chat.push(q);document.getElementById("answer").textContent=/money|cost|price|profit/i.test(q)?"Check every cost, fee and evidence before decision. No payment is authorised.":/safe|privacy|permission/i.test(q)?"Ask consent, minimise personal data, protect each independent business, and stop if evidence is missing.":"Oga, collect evidence first, compare alternatives, and keep UNKNOWN as UNKNOWN. This is scripted research help."});const copy=document.getElementById("copy");if(copy)copy.addEventListener("click",async()=>{const t=document.getElementById("brief").textContent;try{await navigator.clipboard.writeText(t);document.getElementById("copymsg").textContent="Copied."}catch(e){document.getElementById("copymsg").textContent="Copy unavailable in this browser; select the brief text manually."}})}
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>openWork(b.dataset.go)));document.getElementById("back").addEventListener("click",home);
</script></body></html>
